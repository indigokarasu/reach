name: ci

# No untrusted input is interpolated into any `run:` step — the workflow uses no
# ${{ }} expressions at all, so command/ref injection has no surface here.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip pyyaml
      - name: Syntax-check every script
        run: python -m py_compile scripts/*.py scripts/sources/*.py
      - name: Contract tests (offline)
        run: python -m unittest discover -s tests -v
